name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  admin-web:
    name: Admin web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: admin-web

      - name: Type-check and build
        run: npm run build
        working-directory: admin-web

      - name: Committed build is up to date
        run: |
          git status --porcelain -- src/tekes_quota_kit/admin_assets
          test -z "$(git status --porcelain -- src/tekes_quota_kit/admin_assets)" \
            || { echo "::error::Run 'npm run build' in admin-web and commit src/tekes_quota_kit/admin_assets"; exit 1; }
