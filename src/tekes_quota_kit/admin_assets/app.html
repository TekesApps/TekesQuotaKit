<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TekesQuotaKit Admin</title><link rel="stylesheet" href="/admin/app.css"></head><body><main><header><h1>TekesQuotaKit Admin</h1><p>配置授权规则、查看用量、一次性签发客户端凭据。</p></header><section class="access"><label>管理员密钥 <input id="admin-key" type="password" autocomplete="off" placeholder="TEKES_QUOTA_ADMIN_KEY"></label><label>租户 <input id="tenant" placeholder="demo-tenant"></label><button id="connect">连接</button><span id="connection"></span></section><nav><button data-tab="overview" class="active">数据表</button><button data-tab="config">规则配置</button><button data-tab="clients">客户端凭据</button></nav><section id="overview" class="panel"><div class="toolbar"><label>表 <select id="table-name"></select></label><button id="refresh">刷新</button><button id="previous">上一页</button><button id="next">下一页</button><span id="page-status"></span></div><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><p class="hint">消费记录与流水只读。密钥哈希不在列表中显示。</p></section><section id="config" class="panel hidden"><label>配置类型 <select id="operation"></select></label><div id="fields" class="fields"></div><button id="save">保存配置</button><button id="delete-member" class="danger">删除组合映射</button><pre id="config-result"></pre></section><section id="clients" class="panel hidden"><div class="fields"><label>Client ID<input id="client-id" placeholder="measurement-backend"></label><label>Service code<input id="client-service" placeholder="measurement_session"></label><label>角色<select id="client-role"><option value="consumer">consumer</option><option value="issuer">issuer</option><option value="provider">provider</option></select></label><label>API 地址<input id="base-url" placeholder="https://quota.example.com"></label><label class="check"><input id="rotate" type="checkbox">明确轮换已有客户端密钥</label></div><button id="provision">生成密钥并下载 Markdown</button><p class="hint">明文密钥只在本次下载中出现；Kit 仅保存哈希。轮换会立即使旧密钥失效。请妥善保存下载文件，不要提交到 Git。</p><pre id="client-result"></pre></section></main><script src="/admin/app.js"></script></body></html>
