[project]
name = "tekes-quota-kit"
version = "0.2.0"
description = "Shared service entitlement and usage guard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117,<1",
    "pymysql>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.13,<1"]

[project.scripts]
tekes-quota-kit = "tekes_quota_kit.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekes_quota_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
